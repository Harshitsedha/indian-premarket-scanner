name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual "Deploy" button in GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: premarket
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/premarket

            # Snapshot HEAD before pulling so we can diff exactly what changed.
            OLD_HEAD=$(git rev-parse HEAD)
            git checkout -- .
            git clean -fd
            git pull origin main
            CHANGED=$(git diff --name-only "$OLD_HEAD" HEAD)
            echo "Changed files since $OLD_HEAD:"
            echo "${CHANGED:-  (none — already up to date)}"

            # When CHANGED is empty the pull was a no-op (re-run or already current).
            # Treat that as "rebuild everything" so re-runs are never silent no-ops.
            REBUILD_ALL=false
            if [ -z "$CHANGED" ]; then
              echo "=== No file delta detected — forcing full rebuild (re-run or manual trigger) ==="
              REBUILD_ALL=true
            fi

            # ── Dashboard (frontend) ──────────────────────────────────────────
            # Rebuild when dashboard/ files changed, or on a forced full rebuild.
            if [ "$REBUILD_ALL" = true ] || echo "$CHANGED" | grep -qE "^dashboard/"; then
              echo "=== Frontend: rebuilding dashboard ==="
              BUILD_START=$(date +%s)
              cd /opt/premarket/dashboard
              npm install
              npm run build
              # Flaw-2 guard: confirm .next/BUILD_ID was written after this run started.
              BUILD_ID_MTIME=$(date -r .next/BUILD_ID +%s 2>/dev/null || echo 0)
              if [ "$BUILD_ID_MTIME" -lt "$BUILD_START" ]; then
                echo "ERROR: .next/BUILD_ID was not updated — build may be stale or failed silently" >&2
                exit 1
              fi
              sudo /usr/bin/systemctl restart premarket-dashboard
              echo "premarket-dashboard restarted"
              cd /opt/premarket
            fi

            # ── Pipeline (API + scheduler) ────────────────────────────────────
            # Reinstall Python deps and restart services when pipeline/ changed, or on forced rebuild.
            if [ "$REBUILD_ALL" = true ] || echo "$CHANGED" | grep -qE "^pipeline/"; then
              echo "=== Pipeline: reinstalling deps and restarting services ==="
              # Clear stale bytecode so no __pycache__ from pre-deploy code survives.
              find /opt/premarket/pipeline -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
              source pipeline/.venv/bin/activate
              pip install -e pipeline/ --quiet
              sudo /usr/bin/systemctl restart premarket-api
              sudo /usr/bin/systemctl restart premarket-scheduler
              sudo /usr/bin/systemctl restart backtest-worker
              echo "premarket-api + premarket-scheduler + backtest-worker restarted"
            fi

            echo "Deploy complete $(date)"
