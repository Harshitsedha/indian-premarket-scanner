version: "3.9"

services:
  postgres:
    # TimescaleDB on PG16 (Alpine/musl — matches the prior postgres:16-alpine libc, so
    # the reused postgres_data volume keeps its index collations). Pinned, never
    # latest-pg16. NOTE: reusing an existing volume does NOT auto-set
    # shared_preload_libraries — see docs/EDGE_PHASE0_RUNBOOK.md (step 3) for the
    # one-time postgresql.conf change required before CREATE EXTENSION timescaledb.
    image: timescale/timescaledb:2.17.2-pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
  redis_data:
